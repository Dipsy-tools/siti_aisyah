<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Selamat Ulang Tahun, Sayang!</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: url('k.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
    }

    #container {
      background-color: transparent;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      width: 90%;
      max-width: 300px;
      position: relative;
      overflow: hidden;
      border: 3px solid;
      border-image: linear-gradient(90deg, red, green, blue) 1;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }

    #gif {
      position: absolute;
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
    }

    img.photo {
      width: 150px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .text-box {
      background-color: rgba(0, 0, 0, 0.3);
      border: 2px solid;
      border-image: linear-gradient(90deg, cyan, magenta, yellow, cyan) 1;
      border-radius: 10px;
      padding: 15px;
      display: inline-block;
      margin-top: 10px;
    }

    .typing-text {
      display: inline-block;
      white-space: nowrap;
      overflow: hidden;
      animation: typing 3s steps(40, end), blink 0.7s step-end infinite;
      animation-fill-mode: forwards;
      border-right: 2px solid #fff;
      font-weight: bold;
      max-width: 100%;
    }

    @keyframes typing {
      from { width: 0 }
      to { width: 100% }
    }

    @keyframes blink {
      0%, 100% { border-color: transparent }
      50% { border-color: white; }
    }

    #nameInput {
      padding: 10px;
      border-radius: 5px;
      border: none;
      font-size: 16px;
    }

    #startBtn {
      padding: 10px 20px;
      margin-top: 10px;
      border: none;
      border-radius: 5px;
      background: #ff66c4;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
    }

    #content.fade {
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }

    #content.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="container">
    <img id="gif" src="gif.gif" alt="Hiasan" />
    <div id="content" class="fade show">
      <p>Masukkan Namamu:</p>
      <input type="text" id="nameInput" placeholder="Namamu" />
      <br />
      <button id="startBtn">Mulai</button>
    </div>
  </div>

  <audio id="bgMusic" src="bbh.m4a" loop></audio>

  <script>
    const content = document.getElementById('content');
    const nameInput = document.getElementById('nameInput');
    const startBtn = document.getElementById('startBtn');
    const music = document.getElementById('bgMusic');

    const steps = [
      { img: 'k.jpg', text: 'Cieeee ada yang ulang tahun🫶🏻.' },
      { img: 'z.jpg', text: 'Makin tua aja ni sayangku🥰' },
      { img: 'i.jpg', text: 'SELAMAT ULANG TAHUN YA SAYANGKU😘.' },
      { img: 'i.jpg', text: 'SEMOGA PANJANG UMUR😘.' },
      { img: 'i.jpg', text: 'SEHAT TERUS & JANGAN CENGENG😘.' },
      { img: 'h.jpg', text: '~SITI AISYAH 🫶🏻 DIPSY~.' },
    ];

    let currentStep = 0;

    startBtn.addEventListener('click', () => {
      const name = nameInput.value.trim();
      if (name !== '') {
        music.play();
        showStep();
      } else {
        alert('Tolong masukkan nama terlebih dahulu.');
      }
    });

    function showStep() {
      if (currentStep >= steps.length) return;
      content.classList.remove('show');
      content.classList.add('fade');
      setTimeout(() => {
        const { img, text } = steps[currentStep];
        content.innerHTML = `
          <img class="photo" src="${img}" alt="Foto ${currentStep + 1}">
          <div class="text-box">
            <p class="typing-text">${text}</p>
          </div>
        `;
        void content.offsetWidth;
        content.classList.add('show');
        currentStep++;
        if (currentStep < steps.length) {
          setTimeout(showStep, 5000);
        }
      }, 500);
    }
  </script>
</body>
</html>
